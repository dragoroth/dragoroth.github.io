<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>SongSeeker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="musicNoteIcon.ico">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header>
        <div class="icon">🎵</div>
        <nav>
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="menu-icon">☰</label>
            <ul class="menu" id="menu">
                <li id="menu-home-button" class="menu-main-class"><a href="#"><span>🏠</span> Home</a></li>
                
                <li id="cb_settings" class="menu-main-class"><a href="#"><span>⚙️</span> Einstellungen</a></li>
                <div id="settings_div" class="settings_div">
                    <div class="menusubitem">
                        <label class="switch">
                            <input type="checkbox" id="autoplay" name="autoplay">
                            <span class="slider round"></span>
                        </label>
                        <label for="autoplay">Autoplay</label>
                    </div>
                    <div class="menusubitem">
                        <label class="switch">
                            <input type="checkbox" id="randomplayback" name="randomplayback">
                            <span class="slider round"></span>
                        </label>
                        <label for="randomplayback">Zufällige Wiedergabe</label>
                    </div>
                    <div class="menusubitem">
                        <label class="switch">
                            <input type="checkbox" id="playback-duration-limit" name="playback-duration-limit">
                            <span class="slider round"></span>
                        </label>
                        <label for="playback-duration-limit">Zeitlimit (s):</label>
                        <input type="number" min="5" id="playback-duration" value="30">
                    </div>
                    <div class="menusubitem">
                        <label class="switch">
                            <input type="checkbox" id="songinfo" name="songinfo">
                            <span class="slider round"></span>
                        </label>
                        <label for="songinfo">Song-Infos anzeigen</label>
                    </div>
                    <div class="menusubitem">
                        <label class="switch">
                            <input type="checkbox" id="cookies" name="cookies">
                            <span class="slider round"></span>
                        </label>
                        <label for="cookies">Cookies anzeigen</label>
                    </div>
                    <div id="cookielist" class="cookielist"></div>
                    <div class="menusubitem">
                        <label class="switch">
                            <input type="checkbox" id="appOnlyMode" name="appOnlyMode">
                            <span class="slider round"></span>
                        </label>
                        <label for="appOnlyMode">Zufall statt Scan</label>
                    </div>
                    <div class="menusubitem songlist-select">
                        <label for="songlist-picker">Song-Liste:</label>
                        <select name="songlist-picker" id="songlist-picker">
                            <option>hitster-de.csv</option>
                            <option>hitster-nordics.csv</option>
                            <option>hitster-de-aaaa0007.csv</option>
                            <option>hitster-de-aaaa0012.csv</option>
                            <option>hitster-de-aaaa0015.csv</option>
                        </select>
                    </div>
                </div>

                <li id="credits" class="menu-main-class"><a href="#"><span>⭐</span> Credits</a></li>
                <div id="credits_div" class="credits_div">
                    <span id="creditlist">
                        <div id="widmung"></div>
                        Original code by andygruber:<br>
                        <a href="https://github.com/andygruber/songseeker/" target="_blank">Songseeker - Github</a>
                    </span>
                </div>

                <li id="privacy" class="menu-main-class"><a href="privacy_statement.html">Privacy Statement</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="qr-reader" style="display: none;">
            <button id="cancelScanButton" class="scan-button cancelScanButton">Cancel Scan</button>
            <video id="qr-video"></video>
        </div>

        <div class="alert" id="alertBox" onclick="this.style.display='none';" style="display: none;">
            Alert Box
        </div>

        <section class="audiogram">
            <div class="player-container">
                <canvas id="visualizer" width="360" height="360"></canvas>
                
                <!-- Play Button direkt im Zentrum der Animation -->
                <button class="btn-play-pause" id="startstop-video" aria-label="Play/Stop">
                    <svg class="icon-svg icon-play" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg class="icon-svg icon-stop" viewBox="0 0 24 24">
                        <path d="M6 6h12v12H6z"/>
                    </svg>
                </button>
            </div>
        </section>

        <div class="mainButtons">
            <button id="startScanButton" class="scan-button">Scan</button>
            <button id="solveButton" class="scan-button" style="display: none;">Solve</button>
            
            <div id="solveButton-overlay">
                <span id="solveButton-overlay-text" class="solveButton-overlay-text"></span>
            </div>
        </div>

        <div class="videoInfo">
            <div id="videoid">Video ID: <span id="video-id"></span></div>
            <div id="videotitle">Video Title: <span id="video-title"></span></div>
            <div id="videoduration">Video Duration: <span id="video-duration"></span></div>
        </div>
    </main>

    <div id="player"></div> <!-- Load YouTube Player -->

    <script type="module" src="app.js"></script>
</body>
</html>
